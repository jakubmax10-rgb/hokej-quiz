<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Výběr Hry | Hockey Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070d;
            --card-bg: #0e1524;
            --border-color: #223049;
            --text-color: #f4f7fb;
            --text-muted: #8593ab;
            --ice: #3fc6ff;
            --red: #e8283f;
            --gold: #f4c451;
            font-family: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background:
                radial-gradient(ellipse 900px 500px at 50% -10%, rgba(63,198,255,0.16), transparent 60%),
                linear-gradient(180deg, #05070d 0%, #070a13 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrap {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-link {
            align-self: flex-start;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--ice); }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .eyebrow {
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: var(--ice);
            font-weight: 600;
            text-transform: uppercase;
        }

        h1.title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.5rem, 8vw, 3.8rem);
            letter-spacing: 2px;
            line-height: 1;
            margin-top: 4px;
        }

        /* --- Mřížka s hrami --- */
        .games-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            width: 100%;
        }

        @media (min-width: 550px) {
            .games-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .game-card {
            background: linear-gradient(180deg, rgba(14,21,36,0.9), rgba(10,15,26,0.9));
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--ice);
            box-shadow: 0 10px 30px rgba(63,198,255,0.15);
        }

        .card-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .card-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.7rem;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .card-btn {
            background: #131c30;
            border: 1px solid var(--border-color);
            color: var(--ice);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            align-self: flex-start;
            transition: background 0.2s, color 0.2s;
        }

        .game-card:hover .card-btn {
            background: var(--ice);
            color: #05070d;
        }
    </style>
</head>
<body>

    <div class="wrap">
        <a href="index.html" class="back-link">← Zpět na výběr ligy</a>

        <div class="header">
            <div class="eyebrow" id="leagueEyebrow">Vybraná liga</div>
            <h1 class="title" id="leagueTitle">VYBER SI HERNÍ MÓD</h1>
        </div>

        <div class="games-grid" id="gamesGrid">
            <!-- Dynamicky naplněno podle ligy -->
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const league = urlParams.get('league') || 'elh';

        const eyebrow = document.getElementById('leagueEyebrow');
        const title = document.getElementById('leagueTitle');
        const gamesGrid = document.getElementById('gamesGrid');

        // Konfigurace her pro Extraligu (ELH) vs NHL
        const contents = {
            elh: {
                eyebrow: 'Tipsport Extraliga',
                title: 'ELH HERNÍ MÓDY',
                cards: [
                    {
                        href: 'hokej.html',
                        badge: 'Aktivní',
                        icon: '👤',
                        title: 'Hráč Quiz',
                        desc: 'Uhodni tajného hokejistu podle týmu, věku, pozice, čísla a vlajky.'
                    },
                    {
                        href: 'index1.html',
                        badge: 'Multiplayer',
                        icon: '🏒',
                        title: 'Hokejový Manažer',
                        desc: 'Postav tým, draftuj 21 hráčů, zvol trenéra a koučuj zápas s xG simulací.'
                    },
                    {
                        href: 'logo_quiz.html',
                        badge: 'Aktivní',
                        icon: '🛡️',
                        title: 'Poznej Logo',
                        desc: 'Poznej hokejový klub podle detailu loga nebo siluety.'
                    },
                    {
                        href: 'playoff_predict.html',
                        badge: 'Simulace',
                        icon: '🏆',
                        title: 'Predikce Tabulky & Play-off',
                        desc: 'Tipni si umístění po základní části a simuluj cestu vyřazovací fází až do finále.'
                    }
                ]
            },
            nhl: {
                eyebrow: 'National Hockey League',
                title: 'NHL HERNÍ MÓDY',
                cards: [
                    {
                        href: 'nhl_hokej.html',
                        badge: 'Aktivní',
                        icon: '👤',
                        title: 'NHL Hráč Quiz',
                        desc: 'Uhodni tajnou hvězdu NHL podle týmu, divize, věku a statistik.'
                    },
                    {
                        href: 'nhl_higher_lower.html',
                        badge: 'NHL API',
                        icon: '📊',
                        title: 'Vyšší vs Nižší (NHL)',
                        desc: 'Porovnej dvě hvězdy NHL. Kdo má víc gólů, bodů nebo odehraných zápasů?'
                    },
                    {
                        href: 'nhl_logo_quiz.html',
                        badge: 'Aktivní',
                        icon: '⭐',
                        title: 'NHL Poznej Logo',
                        desc: 'Otestuj své znalosti klubových log a arén všech 32 týmů NHL.'
                    },
                    {
                        href: 'nhl_playoff_predict.html',
                        badge: 'Stanley Cup',
                        icon: '🏆',
                        title: 'Stanley Cup Predikce',
                        desc: 'Predikuj výsledky konferencí a kompletní vyřazovací pavouk o Stanley Cup.'
                    }
                ]
            }
        };

        const activeContent = contents[league] || contents.elh;

        eyebrow.textContent = activeContent.eyebrow;
        title.textContent = activeContent.title;

        // Vykreslení karet
        gamesGrid.innerHTML = activeContent.cards.map(card => `
            <a href="${card.href}" class="game-card">
                <span class="card-badge">${card.badge}</span>
                <div class="card-icon">${card.icon}</div>
                <div>
                    <div class="card-title">${card.title}</div>
                    <div class="card-desc">${card.desc}</div>
                </div>
                <div class="card-btn">Hrát nyní ➔</div>
            </a>
        `).join('');
    </script>
</body>
</html>
