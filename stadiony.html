<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Poznej Stadion | ELH Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070d;
            --card-bg: #0e1524;
            --border-color: #223049;
            --text-color: #f4f7fb;
            --text-muted: #8593ab;
            --ice: #3fc6ff;
            --red: #e8283f;
            --red-dark: #9a1626;
            --gold: #f4c451;
            --correct: #23c46a;
            --incorrect: #e8283f;
            font-family: 'Rajdhani', sans-serif;
        }

        html { scroll-padding-top: env(safe-area-inset-top, 0px); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background:
                radial-gradient(ellipse 900px 500px at 50% -10%, rgba(63,198,255,0.16), transparent 60%),
                linear-gradient(180deg, #05070d 0%, #070a13 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 18px 14px calc(24px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 10px;
        }

        .back-btn-top {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(14, 21, 36, 0.7);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .back-btn-top:hover {
            color: var(--ice);
            border-color: var(--ice);
            background: rgba(19, 28, 48, 0.9);
        }

        .wrap {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            text-align: center;
            margin-bottom: 14px;
        }

        .eyebrow {
            font-size: 0.72rem;
            letter-spacing: 4px;
            color: var(--ice);
            font-weight: 600;
            text-transform: uppercase;
        }

        h1.title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.4rem, 10vw, 3.8rem);
            letter-spacing: 2px;
            line-height: 1;
            margin-top: 4px;
        }
        h1.title .w1 { color: #f4f7fb; }
        h1.title .w2 { color: var(--gold); }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: linear-gradient(180deg, rgba(17,26,45,0.9), rgba(14,21,36,0.9));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 18px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }

        .stats-group { display: flex; gap: 24px; }
        .stat-label { font-size: 0.62rem; letter-spacing: 1.5px; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--ice); line-height: 1; }
        .stat-value.streak-value { color: var(--gold); }

        .game-container {
            width: 100%;
            background: linear-gradient(180deg, rgba(17,26,45,0.85), rgba(10,15,26,0.9));
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            text-align: center;
        }

        .prompt-label {
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .team-display {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(63,198,255,0.3);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 480px) {
            .options-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .option-btn {
            background: #111a2d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 60px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--ice);
            background: #17243d;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: var(--correct);
            border-color: var(--correct);
            color: #04160c;
        }

        .option-btn.incorrect {
            background: var(--incorrect);
            border-color: var(--incorrect);
            color: #fff;
        }

        .next-btn {
            display: none;
            width: 100%;
            margin-top: 18px;
            background: linear-gradient(180deg, var(--ice), #2899d3);
            color: #05070d;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(63,198,255,0.3);
            transition: transform 0.15s ease;
        }
        .next-btn:hover { transform: translateY(-1px); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3,5,10,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 20px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: linear-gradient(180deg, #131c30, #0b1120);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .modal h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .modal p { color: var(--text-muted); margin-bottom: 20px; font-size: 1rem; }
        .modal p strong { color: var(--text-color); }

        .modal-btn {
            background: var(--red);
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="league_menu.html?league=elh" class="back-btn-top">← Zpět na nabídku</a>
    </div>

    <div class="wrap">
        <div class="hero">
            <div class="eyebrow">Tipsport Extraliga</div>
            <h1 class="title"><span class="w1">POZNEJ</span> <span class="w2">STADION</span></h1>
        </div>

        <div class="stats-bar">
            <div class="stats-group">
                <div>
                    <div class="stat-label">Skóre</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div>
                    <div class="stat-label">Série</div>
                    <div class="stat-value streak-value" id="streak">0</div>
                </div>
            </div>
        </div>

        <div class="game-container">
            <div class="prompt-label">Jak se jmenuje domácí stadion týmu:</div>
            <div class="team-display" id="teamName">HC Oceláři Třinec</div>

            <div class="options-grid" id="optionsGrid">
                <!-- Tlačítka možností -->
            </div>

            <button class="next-btn" id="nextBtn">Další stadion ➔</button>
        </div>
    </div>

    <script>
        const stadionyDB = [
            { team: "HC Oceláři Třinec", stadium: "WERK ARENA" },
            { team: "HC Dynamo Pardubice", stadium: "Enteria arena" },
            { team: "HC Sparta Praha", stadium: "O2 arena" },
            { team: "HC Verva Litvínov", stadium: "Zimní stadion Ivana Hlinky" },
            { team: "Banes Motor České Budějovice", stadium: "Budvar aréna" },
            { team: "Mountfield HK", stadium: "ČPP Aréna" },
            { team: "Rytíři Kladno", stadium: "ČEZ stadion Kladno" },
            { team: "Bílí Tygři Liberec", stadium: "Home Credit Arena" },
            { team: "HC Škoda Plzeň", stadium: "LOGSPEED CZ ARÉNA" },
            { team: "HC Energie Karlovy Vary", stadium: "Mattoni Aréna" },
            { team: "HC Kometa Brno", stadium: "Winning Group Arena" },
            { team: "HC Vítkovice Ridera", stadium: "Mustang Arena" },
            { team: "BK Mladá Boleslav", stadium: "ŠKO-ENERGO Aréna" },
            { team: "HC Olomouc", stadium: "Zimní stadion Olomouc" }
        ];

        let score = parseInt(localStorage.getItem('stadium_score')) || 0;
        let streak = parseInt(localStorage.getItem('stadium_streak')) || 0;
        let currentItem = null;
        let answered = false;

        const scoreEl = document.getElementById('score');
        const streakEl = document.getElementById('streak');
        const teamNameEl = document.getElementById('teamName');
        const optionsGrid = document.getElementById('optionsGrid');
        const nextBtn = document.getElementById('nextBtn');

        scoreEl.textContent = score;
        streakEl.textContent = streak;

        function nextQuestion() {
            answered = false;
            nextBtn.style.display = 'none';

            // Vybereme náhodný tým
            currentItem = stadionyDB[Math.floor(Math.random() * stadionyDB.length)];
            teamNameEl.textContent = currentItem.team;

            // Vybereme 3 špatné stadiony z ostatních
            let wrongOptions = stadionyDB
                .filter(s => s.stadium !== currentItem.stadium)
                .map(s => s.stadium)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3);

            let options = [...wrongOptions, currentItem.stadium].sort(() => 0.5 - Math.random());

            // Vykreslíme tlačítka
            optionsGrid.innerHTML = options.map(opt => `
                <button class="option-btn" onclick="checkAnswer(this, '${opt.replace(/'/g, "\'")}')">${opt}</button>
            `).join('');
        }

        function checkAnswer(btn, selectedStadium) {
            if (answered) return;
            answered = true;

            const buttons = optionsGrid.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                b.disabled = true;
                if (b.textContent === currentItem.stadium) {
                    b.classList.add('correct');
                }
            });

            if (selectedStadium === currentItem.stadium) {
                score++;
                streak++;
                saveStats();
            } else {
                btn.classList.add('incorrect');
                streak = 0;
                saveStats();
            }

            nextBtn.style.display = 'block';
        }

        function saveStats() {
            localStorage.setItem('stadium_score', score);
            localStorage.setItem('stadium_streak', streak);
            scoreEl.textContent = score;
            streakEl.textContent = streak;
        }

        nextBtn.addEventListener('click', nextQuestion);

        // Spuštění první otázky
        nextQuestion();
    </script>
</body>
</html>
