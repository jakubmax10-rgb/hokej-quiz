<script>
// ===== KONFIGURACE =====
const BUD=()=>(typeof G!='undefined'&&G&&G.mode=='seven')?1000000:2750000;

const TA={aggr:{n:'Agresivní napadání',d:'Vyšší tlak na soupeře, více získaných puků a střel. Větší riziko protiútoků a přečíslení. Stamina: vysoký úbytek (+35 %), bonus k xG.',sh:1.1,opp:1.08,q:1.06,oq:1.08,pen:1.5,dr:1.35},

control:{n:'Kontrola puku',d:'Důraz na držení puku, přihrávky a trpělivé tvoření šancí. Hodí se pro technicky silné a sehrané hráče. Stamina: mírně nižší úbytek (−10 %).',sh:1,opp:.97,q:1,oq:1,pen:.9,dr:.9},

// ===== POZICE NA LEDĚ: výhoda na vlastním postu, nevýhoda na špatném =====
const fitMul=(p,k)=>{if(!p||!p.slotRole||k<0)return 1;const r=SLOT.indexOf(p.slotRole);return r==k?1.04:(r!=1&&k!=1)?.93:r==1?.9:.86};

// ===== SESTAVA A TÝMOVÉ STATISTIKY =====
const emptyTeam=m=>m=='seven'?{F:Array(3).fill(null),D:Array(2).fill(null),G:[null],X:null,seven:true,coach:null}:{F:Array(12).fill(null),D:Array(6).fill(null),G:Array(2).fill(null),coach:null};
const cost=t=>[...t.F,...t.D,...t.G].reduce((s,i)=>s+(i?P[i].price:0),0)+(t.coach?C[t.coach].price:0)+(t.X?P[t.X].price:0);

function lineChem(z){const fs=avg(z.map((p,k)=>p?fitScore(p,k):0)),ws=avg([0,2].map(k=>z[k]?ea(z[k],k,'speed'):0)),cc=z[1]?(ea(z[1],1,'pass')+ea(z[1],1,'tech'))/2:0,
comp=(clamp((ws-60)/25,0,1)+clamp((cc-60)/25,0,1))*50,r=z.map(p=>p&&p.role),sn=r.includes('Sniper'),pm=r.includes('Playmaker'),combo=sn&&pm?100:sn||pm?60:35;

function pairChem(z){const[a,b]=z;if(!a||!b)return 0;const r=[a.role,b.role],df=r.filter(x=>x=='Defensive Defenseman').length,rc=df==1?100:r[0]!=r[1]?80:45,
at=(clamp(((a.a.def+b.a.def)/2-60)/30,0,1)+clamp(((a.a.pass+b.a.pass)/2-60)/30,0,1))*50;return .4*rc+.35*at+.25*pairShare(z)}
function coachFit(co,f,d,g){const k=co.pref[0],A=(ps,key)=>avg(ps.filter(Boolean).map(p=>p.a[key]));let v;
if(k=='aggr')v=(A(f,'phys')+A(f,'speed')+A(d,'phys'))/3;else if(k=='def')v=(A(d,'def')+A(d,'phys')+(g?g.a.pos:60))/3;else if(k=='counter')v=(A(f,'speed')*2+A(d,'pass'))/3;else v=(A(f,'pass')+A(f,'tech')+A(d,'pass'))/3;return n100(v,62,85)}
function calc(t){const f=t.F.map(i=>i&&P[i]),d=t.D.map(i=>i&&P[i]),g=t.G[0]&&P[t.G[0]],co=t.coach&&C[t.coach],x=t.X&&P[t.X];
const nl=f.length/3,nd=d.length/2,fw=FW.slice(0,nl),dw=DW.slice(0,nd),sf=sum(fw),sd=sum(dw);let att=0,def=0,cA=0,cD=0,c1=0,c2=0;

const club=(c1+c2)/2,fit=co?coachFit(co,f,d,g):0,sehr=.2*club+.3*cA+.25*cD+.25*fit,mult=1+(sehr-50)/50*.09,all=[...f,...d,g,x].filter(Boolean);
att*=mult*(co?1+(co.a.att-50)/600:1);def*=mult*(co?1+(co.a.def-50)/600:1);const gk=g?g.ovr+(co?(co.a.gk-50)/12:0):40;

// ===== SIMULACE ZÁPASU (tik = 10 s herního času) =====

const blank=()=>({sh:0,sog:0,xg:0,sv:0,pim:0,ppm:0,ppg:0,fo:0});

const stamp=S=>{const s=S.ot?S.sec-3600:((S.sec-1)%1200)+1;return(S.ot?'OT':S.per+'.')+' '+String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function shot(S,T,M,i,pp,rb){const j=1-i,A=T[i],B=T[j],l=S.ln[i],isD=!rb&&Math.random()<.22;

function slots(t,edit){const g=(pos,arr,n,lab)=>{let h='';for(let l=0;l<arr.length/n;l++)h+=`<div class="sm">${lab} ${l+1}</div><div class="lr ${n==2?'two':''}">${arr.slice(l*n,l*n+n).map((id,k)=>mini(id&&P[id],pos,l*n+k,edit)).join('')}</div>`;return h},c=t.coach&&C[t.coach];
return `<div class="rink">${g('F',t.F,3,'Útok – lajna')}${g('D',t.D,2,'Obrana – pár')}<div class="sm">Brankáři${t.G.length>1?' (hlavní / náhradní)':''}</div><div class="lr two">${t.G.map((id,k)=>mini(id&&P[id],'G',k,edit)).join('')}</div>${t.seven?`<div class="sm">7. hráč (útočník nebo obránce navíc)</div><div class="lr two">${mini(t.X&&P[t.X],'X',0,edit)}</div>`:''}<div class="sm">Trenér</div><div class="lr two"><div class="mini" style="--pc:#f4c451">${c?`<div class="ovr s">${c.ovr}</div><div class="nm">${c.name}</div>${edit?`<button onclick="rem('C')">×</button>`:''}`:'<div class="sm" style="padding-top:14px">nevybrán</div>'}</div></div></div>`}
function statsBox(t){const c=calc(t);return `<div class="panel"><h3>Týmové statistiky</h3>${gauge('Útočná síla',c.att100)}${gauge('Obranná síla',c.def100)}${gauge('Kvalita brankáře',c.gk100)}${gauge('Chemie útoku',c.chemA)}${gauge('Souhra obránců',c.chemD)}${gauge('Klubová chemie',c.club)}${gauge('Celková sehranost',c.sehr)}${gauge('Vliv trenéra',c.infl)}<div class="sm">Sehranost mění sílu útoku i obrany až o ±9 %. Ovlivňuje ji klub, správné posty (LK/C/PK), styl lajny, role obránců a shoda trenéra s týmem.</div></div>`}
function build(){const t=G.teams[G.cur],sp=cost(t),ok=complete(t)&&sp<=BUD();let list;
if(G.tab=='C')list=coaches.map(c=>ccard(c,`<button class="blu" onclick="add('${c.id}')">${t.coach==c.id?'Vybrán':'Vybrat'}</button>`)).join('');
else{let a=players.filter(p=>p.pos==G.tab&&p.name.toLowerCase().includes(G.q.toLowerCase())&&(!G.rf||p.slotRole==G.rf));a.sort((x,y)=>G.sort=='price'?y.price-x.price:G.sort=='ovr'?y.ovr-x.ovr:(y.a[G.sort]||0)-(x.a[G.sort]||0));
list=a.map(p=>{const d=t[p.pos].includes(p.id)||t.X==p.id?'disabled':'';return card(p,p.pos=='F'?SL.map((l,k)=>`<button class="${SLOT[k]==p.slotRole?'blu':''}" ${d} title="${SLOT[k]}" onclick="add('${p.id}',${k})">${l}</button>`).join(''):`<button class="blu" ${d} onclick="add('${p.id}')">+ Přidat</button>`)}).join('')}
return `<h2>${NM(G.cur)} – ${G.mode=='seven'?'sestava sedmi hráčů':'kompletní tým'}</h2><div class="panel row"><div class="grow"><b>Rozpočet:</b> ${kc(BUD())} · <b>Utraceno:</b> ${kc(sp)} · <b>Zbývá:</b> <span style="color:${BUD()-sp<20000?'#ffb4b4':'var(--g)'}">${kc(BUD()-sp)}</span></div><button class="pri" ${ok?'':'disabled'} onclick="G.confirm=true;render()">Hotovo</button></div>${G.msg?`<div class="panel warn">${G.msg}</div>`:''}
<div class="cols"><div><div class="row">${[['F','Útočníci'],['D','Obránci'],['G','Brankáři'],['C','Trenéři']].map(([k,l])=>`<button class="${G.tab==k?'blu':''}" onclick="G.tab='${k}';G.rf='';G.sort='ovr';render()">${l}</button>`).join('')}</div>
${G.tab!='C'?`<div class="row" style="margin-top:6px"><input id="q" class="grow" placeholder="Hledat jméno" value="${G.q}" oninput="G.q=this.value;render();document.getElementById('q').focus()"><select onchange="G.sort=this.value;render()">${['ovr','price',...K[G.tab]].map(k=>`<option value="${k}" ${G.sort==k?'selected':''}>Řadit: ${k=='ovr'?'OVR':k=='price'?'Cena':LBL[k]}</option>`).join('')}</select>${G.tab=='F'?`<select onchange="G.rf=this.value;render()"><option value="">Všechny posty</option>${SLOT.map(s=>`<option ${G.rf==s?'selected':''}>${s}</option>`).join('')}</select>`:''}</div>`:''}
<details class="panel sm"><summary>Jak atributy ovlivňují hru</summary>Vhazování: centr rozhoduje o vyhraném vhazování. Střela/Zakončení: xG a gól. Přihrávky/Technika/Rychlost/Fyzická: tvorba šancí lajny. Obrana/Fyzická obránců: potlačení a blokování střel. Brankář: Reflexy (nebezpečné střely), Postřeh (střely z dálky), Poziční hra (vše), Dorážky (odražené puky), Stabilita (výkyvy). Hráč na svém postu (LK/C/PK) má bonus, na špatném postu postih. Do sestavy lze přetahovat myší, nebo klepnout na dva hráče a prohodit je.</details>
<div class="list">${list}</div></div><div><div class="panel">${slots(t,true)}</div>${statsBox(t)}</div></div>`}
function lineup(i){const t=G.teams[i],c=calc(t);return `<div><h3>${NM(i)}</h3><div class="sm">Utraceno ${kc(c.cost)} · zbývá ${kc(BUD()-c.cost)}</div><div class="panel">${slots(t,false)}</div></div>`}
function reveal(){const a=calc(G.teams[0]),b=calc(G.teams[1]),R=[['Průměrné OVR','ovr'],['Útočná síla','att100'],['Obranná síla','def100'],['Brankář','gk100'],['Chemie útoku','chemA'],['Souhra obránců','chemD'],['Klubová chemie','club'],['Sehranost','sehr'],['Vliv trenéra','infl'],['Přesilovky (trenér)','pp'],['Oslabení (trenér)','pk']];
return `<h2>Odhalení sestav</h2><div class="panel"><div class="row" style="justify-content:space-between"><b>${NM(0)}</b><b>${NM(1)}</b></div>${R.map(([l,k])=>bar(l,a[k],b[k])).join('')}<div class="cmp"><em>Utraceno</em><span style="min-width:110px">${kc(a.cost)}</span><span class="grow"></span><span style="min-width:110px">${kc(b.cost)}</span></div><div class="sm">Porovnání ukazuje silné a slabé stránky, vítěze určí až zápas.</div></div><div class="cols">${lineup(0)}${lineup(1)}</div><button class="pri" onclick="startMatch()">Přejít k zápasu</button>`}
function statTable(){const r=(l,f)=>`<tr><td>${f(0)}</td><td class="sm">${l}</td><td>${f(1)}</td></tr>`,s=S.st,tf=s[0].fo+s[1].fo;
return `<table>${r('Střely',i=>s[i].sh)}${r('Střely na branku',i=>s[i].sog)}${r('xG',i=>s[i].xg.toFixed(2))}${r('Zákroky',i=>s[i].sv)}${r('Úspěšnost zákroků',i=>{const q=s[1-i];return q.sog?Math.round(q.sv/q.sog*100)+' %':'–'})}${r('Trestné minuty',i=>s[i].pim)}${r('Přesilovky (min / góly)',i=>Math.round(s[i].ppm)+' / '+s[i].ppg)}${r('Vyhraná vhazování',i=>s[i].fo+(tf?' ('+Math.round(s[i].fo/tf*100)+' %)':''))}</table>`}
const mmss=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function liveHtml(){const pl=n=>(S.ot?3:Math.max(3,5-S.pen[n].length))+(S.pull[n]?1:0),e=S.ot?S.sec-3600:S.sec?((S.sec-1)%1200)+1:0,
lab=S.ot?'Prodloužení':(S.stage=='setup'&&S.sec>0?(S.per-1)+'. třetina – konec':S.per+'. třetina');
const tn=i=>`<div class="tb ${i?'r':''}"><div class="sm">${NM(i)}</div><div class="tsc">${S.sc[i]}</div><div class="sm">${TA[S.tac[i]].n}</div>${S.pull[i]?'<div class="warn">⚠ bez brankáře (6 hráčů, prázdná branka)</div>':''}</div>`;
let h=`<div class="sb">${tn(0)}<div class="mid"><div class="sm">${lab}</div><div class="clk" id="clk">${mmss(e)}</div><div class="sm">Na ledě ${pl(0)} v ${pl(1)}${S.pen[0].length+S.pen[1].length?'<br><span class="warn">'+S.pen[0].map(x=>NM(0)+' '+mmss(x)).concat(S.pen[1].map(x=>NM(1)+' '+mmss(x))).join(' · ')+'</span>':''}</div></div>${tn(1)}</div>`;
if(S.stage=='run'&&!S.ot&&S.sec>=3300)h+=`<div class="panel row">${[0,1].map(i=>S.gp[i].stage=='active'?`<button onclick="retg(${i})">${NM(i)}: vrátit brankáře</button>`:`<button onclick="manual(${i})">${NM(i)}: odvolat brankáře</button>`).join('')}${S.gp.map((g,i)=>g.stage=='planned'?`<span class="sm">${NM(i)}: plán od ${g.from}:00 před koncem</span>`:'').join('')}</div>`;
return h+`<div class="cols"><div class="panel">${statTable()}</div><div class="panel log">${S.log.slice(-16).reverse().map(x=>`<div>${x}</div>`).join('')||'<div class="sm">Zápas ještě nezačal.</div>'}</div></div>`}
function live(){const e=document.getElementById('live');e?e.innerHTML=liveHtml():render()}
function match(){return `<div id="live">${liveHtml()}</div><div class="panel" id="ctrl"><h3>Řízení týmu (kdykoli během zápasu)</h3><div class="sm">Stamina: hráči na ledě se unavují podle věku a ratingu, na střídačce odpočívají. Unavení hráči mají horší atributy a dělají víc chyb.</div><div class="cols">${[0,1].map(i=>`<div><b>${NM(i)}</b><br><select onchange="setTac(${i},this.value)">${TK.map(k=>`<option value="${k}" ${S.tac[i]==k?'selected':''}>${TA[k].n}</option>`).join('')}</select><div class="sm" id="td${i}">${TA[S.tac[i]].d}</div>
<div class="sm" style="margin-top:6px">Útočné lajny</div><div class="row">${Array.from({length:T[i].f.length/3},(_,l)=>`<button id="l${i}_${l}" onclick="setLine(${i},${l})"></button>`).join('')}</div>
<div class="sm" style="margin-top:6px">Obranné páry</div><div class="row">${Array.from({length:T[i].d.length/2},(_,l)=>`<button id="d${i}_${l}" onclick="setLine(${i},${l},'d')"></button>`).join('')}</div>
<div class="sm" style="margin-top:6px">Na ledě: <span id="oi${i}"></span></div><div class="row" style="margin-top:6px"><button id="gs${i}" onclick="swapGk(${i})"></button></div><label class="sm"><input type="checkbox" ${S.auto[i]?'checked':''} onchange="S.auto[${i}]=this.checked"> Automatické střídání (při stamině pod 50 %)</label></div>`).join('')}</div>${S.stage=='setup'?`<br><button class="pri" onclick="runPeriod()">${S.ot?'Hrát prodloužení':S.per==1&&!S.sec?'Zahájit zápas':'Odehrát '+S.per+'. třetinu'}</button>`:''}</div>`}
function final(){const w=S.sc[0]>S.sc[1]?0:1,rt=i=>[...T[i].f,...T[i].d,...T[i].gs.filter(p=>p==T[i].g||S.pl[p.id].sa>0)].map(p=>[p,rating(p,S,i==w)]).sort((a,b)=>b[1]-a[1]);
return `<div class="panel"><h2 style="text-align:center">Konec zápasu</h2><div class="score"><span>${S.sc[0]}</span>:<span>${S.sc[1]}</span></div><div style="text-align:center">${S.so?'Po samostatných nájezdech ':S.ot?'Po prodloužení ':''}vyhrál <b>${NM(w)}</b></div></div>
<div class="cols"><div class="panel"><h3>Statistiky</h3>${statTable()}</div><div class="panel log"><h3>Průběh</h3>${S.log.filter(x=>x.includes('GÓL')||x.includes('Vylou')||x.includes('—')||x.includes('nájezdy')||x.includes('brankář')).map(x=>`<div>${x}</div>`).join('')}</div></div>
<div class="cols">${[0,1].map(i=>`<div class="panel"><h3>Hodnocení hráčů – ${NM(i)}</h3><table>${rt(i).slice(0,8).map(([p,r])=>{const x=S.pl[p.id];return `<tr><td style="text-align:left">${p.name}</td><td class="sm">${p.pos=='G'?x.sv+'/'+x.sa+' zák.':x.g+'+'+x.a+', '+x.sh+' stř.'}</td><td><b>${r.toFixed(1)}</b></td></tr>`}).join('')}</table></div>`).join('')}</div><button class="pri" onclick="reset()">Nová hra</button>`}
function render(){const ph=G.phase;let h='';
if(ph=='MENU')h=`<div class="panel" style="max-width:600px;margin:30px auto;text-align:center;padding:28px"><h1>🏒 Hokejový manažer</h1><h3 style="color:var(--b)">Vítejte v souboji manažerů!</h3><p>Sestavte svůj tým z ${players.length} extraligových hráčů a ${coaches.length} trenérů, vyberte taktiku a sledujte zápas. Rozpočet: ${kc(2750000)} (kompletní tým) / ${kc(1000000)} (režim sedmi hráčů). Sestavy zůstanou skryté do potvrzení obou.</p>
<div style="text-align:left"><div class="sm">Jméno 1. manažera</div><input id="p1-name-input" value="Hráč 1" style="width:100%;margin-bottom:10px"><div class="sm">Jméno 2. manažera</div><input id="p2-name-input" value="Hráč 2" style="width:100%;margin-bottom:14px"></div>
<div class="row" style="justify-content:center"><button class="pri" onclick="newGame('full')">Kompletní tým (2 G, 6 O, 12 Ú, trenér)</button><button class="blu" onclick="newGame('seven')">Režim sedmi hráčů (1 G, 2 O, 3 Ú, +1)</button></div></div>`;
else if(ph=='P1'||ph=='P2'){G.cur=ph=='P1'?0:1;h=build()}
else if(ph=='HANDOFF')h=`<div class="panel" style="text-align:center;padding:40px;max-width:520px;margin:30px auto"><div style="font-size:3em">🔒</div><h2>${NM(0)} dokončil sestavu.</h2><p>Předejte zařízení hráči ${NM(1)}. ${NM(0)} se nesmí dívat na obrazovku. Žádné informace o prvním týmu se nezobrazují.</p><button class="pri" onclick="go('P2')">Jsem ${NM(1)} – otevřít můj draft</button></div>`;
else if(ph=='REVEAL')h=reveal();else if(ph=='MATCH')h=S.stage=='final'?final():match();
if(G.confirm)h+=`<div class="modal"><div class="panel"><p>Opravdu chceš potvrdit a uzamknout svou sestavu? Po potvrzení ji nebude možné měnit, dokud druhý hráč nedokončí výběr.</p><div class="row"><button onclick="G.confirm=false;render()">Vrátit se k sestavě</button><button class="pri" onclick="confirmTeam()">Potvrdit sestavu</button></div></div></div>`;
if(ph=='MATCH'&&S&&S.modal){const m=S.modal,n=NM(m.i);h+=`<div class="modal"><div class="panel">`+(m.type=='offer'?`<h3>${n}, ${m.d<0?'tvůj tým prohrává':'stav je nerozhodný'}.</h3><p>Zbývá ${m.rem}:00. Chceš hrát bez brankáře (6 v 5, ale s prázdnou brankou)?</p><div class="row"><button class="pri" onclick="ans('offer',1)">ANO – chci hrát bez brankáře</button><button onclick="ans('offer',0)">NE – ponechám brankáře</button></div>`:m.type=='time'?`<h3>${n}: od které minuty chceš hrát bez brankáře?</h3><div class="row">${[5,4,3,2,1].filter(x=>x<=m.rem).map(x=>`<button class="blu" onclick="ans('time',${x})">${x}:00 před koncem</button>`).join('')}<button onclick="ans('time',0)">Zrušit</button></div>`:`<h3>${n}: poslední potvrzení</h3><p>Zbývá ${m.rem}:00, skóre ${S.sc[0]}:${S.sc[1]}. Opravdu odvolat brankáře? Šestý hráč nastoupí z tvé sestavy.</p><div class="row"><button class="pri" onclick="ans('confirm',1)">Odvolat brankáře</button><button onclick="ans('confirm',0)">Ponechat</button></div>`)+`</div></div>`}
$.innerHTML=h+(ph!='MENU'?`<div class="row" style="margin-top:12px"><button onclick="if(confirm('Opravdu začít znovu?'))reset()">Restart hry</button></div>`:'');if(ph=='MATCH'&&S&&S.stage!='final')updCtrl()}
for(let i=0;i<14;i++){const e=document.createElement('div'),z=20+Math.random()*50;e.className='shard';e.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z*1.4}px;animation-duration:${25+Math.random()*30}s;animation-delay:-${Math.random()*40}s`;document.getElementById('ice').appendChild(e)}
reset();

</script></body></html>
