<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vyšší vs Nižší | ELH Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070d;
            --card-bg: #0e1524;
            --border-color: #223049;
            --text-color: #f4f7fb;
            --text-muted: #8593ab;
            --red: #e8283f;
            --ice: #3fc6ff;
            --gold: #f4c451;
            --green: #23c46a;
            font-family: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background:
                radial-gradient(ellipse 900px 500px at 50% -10%, rgba(63,198,255,0.16), transparent 60%),
                linear-gradient(180deg, #05070d 0%, #070a13 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 14px;
        }

        .back-nav {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .back-btn-top {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(14, 21, 36, 0.7);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        .back-btn-top:hover {
            color: var(--ice);
            border-color: var(--ice);
            background: rgba(19, 28, 48, 0.9);
            transform: translateX(-3px);
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .eyebrow {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--ice);
            font-weight: 600;
            text-transform: uppercase;
        }

        h1.title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.5rem, 8vw, 3.8rem);
            letter-spacing: 2px;
            line-height: 1;
        }

        .score-board {
            display: flex;
            gap: 30px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .score-item { text-align: center; }
        .score-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .score-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--ice); line-height: 1; }

        /* --- Srovnávací aréna --- */
        .arena {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        @media (min-width: 650px) {
            .arena { grid-template-columns: 1fr 1fr; }
        }

        .versus-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: var(--gold);
            color: #05070d;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(244,196,81,0.5);
            z-index: 5;
        }

        .player-card {
            background: linear-gradient(180deg, rgba(14,21,36,0.95), rgba(8,12,22,0.95));
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
        }

        .player-team {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .player-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin-bottom: 16px;
            color: #fff;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            width: 100%;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .stat-title {
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            color: var(--ice);
            line-height: 1;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn-choice {
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-higher {
            background: linear-gradient(180deg, #23c46a, #168a48);
            color: white;
            box-shadow: 0 4px 15px rgba(35,196,106,0.3);
        }

        .btn-lower {
            background: linear-gradient(180deg, var(--red), #a81325);
            color: white;
            box-shadow: 0 4px 15px rgba(232,40,63,0.3);
        }

        .btn-choice:hover { transform: translateY(-2px); }

        /* Modal konec hry */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3,5,10,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        .modal h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--red); margin-bottom: 8px; }
        .modal p { color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }

        .modal-btn {
            background: var(--ice);
            color: #05070d;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="league_menu.html?league=elh" class="back-btn-top">← Zpět na nabídku</a>
    </div>

    <div class="header">
        <div class="eyebrow">Porovnání Statistik Hráčů ELH</div>
        <h1 class="title">VYŠŠÍ NEBO NIŽŠÍ?</h1>
    </div>

    <div class="score-board">
        <div class="score-item">
            <div class="score-label">Skóre</div>
            <div class="score-val" id="scoreVal">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">Nejlepší série</div>
            <div class="score-val" id="highScoreVal" style="color:var(--gold);">0</div>
        </div>
    </div>

    <div class="arena">
        <div class="versus-circle">VS</div>

        <!-- Levý hráč -->
        <div class="player-card" id="leftCard">
            <div class="player-team" id="leftTeam">-</div>
            <div class="player-name" id="leftName">-</div>
            <div class="stat-box">
                <div class="stat-title" id="leftStatTitle">Kategorie</div>
                <div class="stat-number" id="leftStatVal">?</div>
            </div>
        </div>

        <!-- Pravý hráč -->
        <div class="player-card" id="rightCard">
            <div class="player-team" id="rightTeam">-</div>
            <div class="player-name" id="rightName">-</div>
            <div class="stat-box">
                <div class="stat-title" id="rightStatTitle">Kategorie</div>
                <div class="stat-number" id="rightStatVal">?</div>
            </div>

            <div class="action-btns" id="actionBtns">
                <button class="btn-choice btn-higher" onclick="makeGuess('higher')">MÁ VÍCE / VYŠŠÍ ▲</button>
                <button class="btn-choice btn-lower" onclick="makeGuess('lower')">MÁ MÉNĚ / NIŽŠÍ ▼</button>
            </div>
        </div>
    </div>

    <!-- Modal konec hry -->
    <div class="modal-overlay" id="gameOverModal">
        <div class="modal">
            <h2>Konec hry!</h2>
            <p id="modalDesc">Špatný tip.</p>
            <button class="modal-btn" onclick="resetGame()">Hrát znovu 🔄</button>
        </div>
    </div>

    <!-- Databáze statistik -->
    <script src="stats_elh.js"></script>

    <script>
        const categories = [
            { id: 'points', label: 'Kanadské body', unit: '' },
            { id: 'radegast', label: 'Radegast Index', unit: '' },
            { id: 'age', label: 'Věk', unit: 'let' },
            { id: 'height', label: 'Výška', unit: 'cm' },
            { id: 'weight', label: 'Váha', unit: 'kg' },
            { id: 'number', label: 'Číslo dresu', unit: '' }
        ];

        let currentScore = 0;
        let highScore = parseInt(localStorage.getItem('hl_stats_highscore')) || 0;
        
        let playerLeft = null;
        let playerRight = null;
        let currentCategory = categories[0];

        document.getElementById('highScoreVal').textContent = highScore;

        function getRandomPlayer(excludeName) {
            let filtered = statsDBData.filter(p => p.name !== excludeName);
            return filtered[Math.floor(Math.random() * filtered.length)];
        }

        function pickRandomCategory() {
            return categories[Math.floor(Math.random() * categories.length)];
        }

        function initGame() {
            playerLeft = getRandomPlayer();
            playerRight = getRandomPlayer(playerLeft.name);
            currentCategory = pickRandomCategory();
            updateUI(false);
        }

        function updateUI(revealRight = false) {
            const unitSuffix = currentCategory.unit ? ` (${currentCategory.unit})` : '';

            document.getElementById('leftTeam').textContent = playerLeft.team;
            document.getElementById('leftName').textContent = playerLeft.name;
            document.getElementById('leftStatTitle').textContent = currentCategory.label + unitSuffix;
            document.getElementById('leftStatVal').textContent = playerLeft[currentCategory.id];

            document.getElementById('rightTeam').textContent = playerRight.team;
            document.getElementById('rightName').textContent = playerRight.name;
            document.getElementById('rightStatTitle').textContent = currentCategory.label + unitSuffix;
            
            if (revealRight) {
                document.getElementById('rightStatVal').textContent = playerRight[currentCategory.id];
            } else {
                document.getElementById('rightStatVal').textContent = '?';
            }
        }

        function makeGuess(guess) {
            const valLeft = playerLeft[currentCategory.id];
            const valRight = playerRight[currentCategory.id];

            let isCorrect = false;

            if (guess === 'higher' && valRight >= valLeft) isCorrect = true;
            if (guess === 'lower' && valRight <= valLeft) isCorrect = true;

            updateUI(true);

            if (isCorrect) {
                currentScore++;
                if (currentScore > highScore) {
                    highScore = currentScore;
                    localStorage.setItem('hl_stats_highscore', highScore);
                    document.getElementById('highScoreVal').textContent = highScore;
                }
                document.getElementById('scoreVal').textContent = currentScore;

                setTimeout(() => {
                    playerLeft = playerRight;
                    playerRight = getRandomPlayer(playerLeft.name);
                    currentCategory = pickRandomCategory();
                    updateUI(false);
                }, 1000);
            } else {
                setTimeout(() => {
                    const unitSuffix = currentCategory.unit ? ` ${currentCategory.unit}` : '';
                    document.getElementById('modalDesc').innerHTML = 
                        `<strong>${playerRight.name}</strong> má ${currentCategory.label.toLowerCase()}: <strong>${valRight}${unitSuffix}</strong> (vs ${valLeft}${unitSuffix}).<br><br>Konečné skóre: <strong>${currentScore}</strong>`;
                    document.getElementById('gameOverModal').classList.add('active');
                }, 800);
            }
        }

        function resetGame() {
            currentScore = 0;
            document.getElementById('scoreVal').textContent = currentScore;
            document.getElementById('gameOverModal').classList.remove('active');
            initGame();
        }

        initGame();
    </script>
</body>
</html>
