name: Automatická aktualizace statistik ELH

on:
  schedule:
    - cron: '0 5 * * *'  # Spustí se každý den v 5:00 UTC (v 6:00 ráno našeho času)
  workflow_dispatch:     # Umožní ruční spuštění jedním kliknutím

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Načtení kódu z repozitáře
        uses: actions/checkout@v3

      - name: Nastavení Pythonu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalace potřebných knihoven
        run: |
          python -m pip install --upgrade pip

      - name: Spuštění skriptu pro stahování statistik
        run: python update_stats.py

      - name: Uložení změn zpět do repozitáře
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add stats_elh.js
          git diff-index --quiet HEAD || git commit -m "Auto-update: Aktualizované statistiky ELH"
          git push
